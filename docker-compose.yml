# Procurement Finance — NAS (UGREEN DXP4800 Plus). Запуск: cp .env.example .env && docker compose up -d --build
# Наружу публикуется только cloudflared (исходящее соединение). Порты postgres/api/web на хост НЕ пробрасываются.
name: procurement-finance

x-restart: &restart
  restart: unless-stopped # автозапуск после перезагрузки NAS

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pf
      POSTGRES_USER: pf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pf -d pf"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    <<: *restart
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pf:${POSTGRES_PASSWORD}@postgres:5432/pf
      UPLOAD_DIR: /data/uploads
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      COOKIE_SECURE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: &logging { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    networks: [internal]

  worker:
    <<: *restart
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    command: ["node", "dist/worker.js"]
    depends_on: { api: { condition: service_healthy } } # api применяет миграции
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pf:${POSTGRES_PASSWORD}@postgres:5432/pf
      UPLOAD_DIR: /data/uploads
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - uploads:/data/uploads
    logging: *logging
    networks: [internal]

  web:
    <<: *restart
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    depends_on: { api: { condition: service_healthy } }
    environment:
      API_INTERNAL_URL: http://api:4000
    logging: *logging
    networks: [internal]

  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?задайте CLOUDFLARE_TUNNEL_TOKEN в .env}
    depends_on: [web]
    networks: [internal]

  # Ежедневная резервная копия БД (pg_dump) с ротацией. Вручную: docker compose run --rm backup /backup.sh
  backup:
    <<: *restart
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c", "while true; do /backup.sh; sleep 86400; done"]
    environment:
      PGHOST: postgres
      PGUSER: pf
      PGDATABASE: pf
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata:
  uploads:
